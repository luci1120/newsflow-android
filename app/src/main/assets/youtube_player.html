<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  #player {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
  }
  #msg {
    position: absolute;
    top: 50%;
    left: 0;
    right: 0;
    transform: translateY(-50%);
    color: #aaa;
    font-family: sans-serif;
    font-size: 14px;
    text-align: center;
    padding: 0 16px;
    pointer-events: none;
  }
</style>
</head>
<body>
<div id="player"></div>
<div id="msg">Loading video…</div>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
  var player = null;
  var pendingSpeed = 1.0;
  var segStart = null;   // current segment start (seconds)
  var segEnd = null;     // current segment end (seconds)
  var monitor = null;    // interval that enforces the segment boundary

  function getParam(name) {
    var m = new RegExp('[?&]' + name + '=([^&]+)').exec(window.location.search);
    return m ? decodeURIComponent(m[1]) : null;
  }

  var videoId = getParam('videoId');

  // Initial segment bounds passed from Kotlin (auto-play first segment on ready)
  var initStart = getParam('start');
  var initEnd = getParam('end');
  if (initStart !== null) segStart = parseFloat(initStart);
  if (initEnd !== null) segEnd = parseFloat(initEnd);

  function onYouTubeIframeAPIReady() {
    document.getElementById('msg').style.display = 'none';
    if (!videoId) return;
    player = new YT.Player('player', {
      height: '100%',
      width: '100%',
      videoId: videoId,
      playerVars: {
        'playsinline': 1,
        'rel': 0,
        'modestbranding': 1,
        'enablejsapi': 1,
        'controls': 0,          // hide native controls — segment flow is app-driven
        'disablekb': 1,
        'origin': window.location.origin
      },
      events: {
        'onReady': function (e) {
          e.target.setPlaybackRate(pendingSpeed);
          if (segStart !== null) {
            startSegmentPlayback();
          }
        },
        'onError': function (e) {
          var msg = document.getElementById('msg');
          msg.style.display = 'block';
          msg.textContent = 'Video error code: ' + e.data;
        }
      }
    });
  }

  // Enforce the segment boundary: pause as soon as we reach segEnd
  function startMonitor() {
    stopMonitor();
    monitor = setInterval(function () {
      if (!player || !player.getCurrentTime) return;
      if (segEnd === null) return;
      var t = player.getCurrentTime();
      if (t >= segEnd) {
        player.pauseVideo();
        stopMonitor();
      }
    }, 150);
  }

  function stopMonitor() {
    if (monitor) {
      clearInterval(monitor);
      monitor = null;
    }
  }

  function startSegmentPlayback() {
    if (!player || !player.seekTo) return;
    player.seekTo(segStart, true);
    player.setPlaybackRate(pendingSpeed);
    player.playVideo();
    startMonitor();
  }

  // Called from Kotlin when the learner taps a segment chip
  function playSegment(start, end) {
    segStart = start;
    segEnd = end;
    if (player && player.seekTo) {
      startSegmentPlayback();
    }
  }

  // Called from Kotlin when the learner taps "Replay"
  function replaySegment() {
    if (segStart === null) return;
    startSegmentPlayback();
  }

  // Called from Kotlin to stop playback
  function pauseVideo() {
    stopMonitor();
    if (player && player.pauseVideo) {
      player.pauseVideo();
    }
  }

  function setSpeed(s) {
    pendingSpeed = s;
    if (player && player.setPlaybackRate) {
      player.setPlaybackRate(s);
    }
  }
</script>
</body>
</html>
